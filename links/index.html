<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pedro de Rossi · Links</title>
  <meta name="description" content="Links de Pedro de Rossi: portfólio e LinkedIn." />
  <meta name="theme-color" content="#050a18" />
  <meta property="og:title" content="Pedro de Rossi · Links" />
  <meta property="og:description" content="Dashboards e sites sob medida · Portfólio e LinkedIn" />
  <meta property="og:image" content="https://pedroderossi.github.io/assets/img/pedro.jpg" />
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050a18;
      --surface: rgba(13, 24, 52, 0.7);
      --text: #e6f1ff;
      --text-muted: #8b9bbd;
      --border: rgba(0, 217, 255, 0.18);
      --neon: #00d9ff;
      --neon-2: #2f6bff;
      --neon-rgb: 0, 217, 255;
      --on-neon: #021022;
      --glow: 0 0 12px rgba(var(--neon-rgb), 0.55), 0 0 36px rgba(var(--neon-rgb), 0.25);
      --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
      --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      color-scheme: dark;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: var(--font-sans); -webkit-font-smoothing: antialiased;
      display: grid; place-items: center;
      min-height: 100vh; min-height: 100svh;
      padding: max(40px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 2px solid var(--neon); outline-offset: 4px; border-radius: 12px; }

    /* Fundo: rede de partículas + brilhos */
    canvas { position: fixed; inset: 0; z-index: -2; width: 100%; height: 100%; }
    .glow {
      position: fixed; inset: 0; z-index: -3; pointer-events: none;
      background:
        radial-gradient(60vmax 60vmax at 90% 0%, rgba(var(--neon-rgb), 0.12), transparent 60%),
        radial-gradient(60vmax 60vmax at 0% 100%, rgba(47, 107, 255, 0.16), transparent 60%);
    }

    main { width: 100%; max-width: 440px; display: grid; justify-items: center; gap: 28px; text-align: center; }

    .in { opacity: 0; transform: translateY(18px); animation: in 0.8s var(--ease) forwards; animation-delay: calc(var(--d) * 0.12s); }
    @keyframes in { to { opacity: 1; transform: none; } }

    /* Foto com anel neon */
    .avatar { position: relative; width: 132px; height: 132px; }
    .ring {
      position: absolute; inset: -9px; border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0 20%, var(--neon) 40%, var(--neon-2) 55%, transparent 70%, transparent 85%, var(--neon) 100%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
      filter: drop-shadow(0 0 8px var(--neon));
      animation: spin 5s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .avatar img {
      width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
      border: 1px solid rgba(var(--neon-rgb), 0.4);
      box-shadow: 0 0 40px rgba(var(--neon-rgb), 0.3);
    }

    .head { display: grid; gap: 6px; }
    .logo { font: 500 0.8rem var(--font-mono); color: var(--neon); letter-spacing: 0.04em; }
    h1 { margin: 0; font: 700 1.9rem / 1.1 var(--font-display); letter-spacing: -0.03em; }
    h1 span {
      background: linear-gradient(90deg, var(--neon), var(--neon-2), var(--neon));
      background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: shimmer 5s linear infinite;
    }
    @keyframes shimmer { to { background-position: 200% 0; } }
    .tagline { margin: 4px 0 0; color: var(--text-muted); font-size: 0.98rem; line-height: 1.5; }

    /* Botões de link */
    .links { list-style: none; margin: 0; padding: 0; width: 100%; display: grid; gap: 14px; }
    .link {
      position: relative; overflow: hidden;
      display: flex; align-items: center; gap: 14px;
      padding: 16px 18px; border-radius: 16px;
      background: var(--surface); border: 1px solid var(--border);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      text-align: left;
      transition: transform 0.3s var(--ease), border-color 0.3s, box-shadow 0.3s;
    }
    .link::after {
      content: ""; position: absolute; top: 0; left: -80%; width: 50%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(var(--neon-rgb), 0.2), transparent);
      transform: skewX(-20deg); animation: sweep 4s var(--ease) infinite; animation-delay: calc(var(--d) * 0.6s);
      pointer-events: none;
    }
    @keyframes sweep { 0%, 60% { left: -80%; } 100% { left: 140%; } }
    .link:hover, .link:active { transform: translateY(-3px) scale(1.01); border-color: var(--neon); box-shadow: var(--glow); }
    .link.primary { background: linear-gradient(135deg, var(--neon), var(--neon-2)); border-color: transparent; color: var(--on-neon); }
    .link.primary .link-sub { color: rgba(2, 16, 34, 0.75); }
    .link.primary .link-icon { background: rgba(2, 16, 34, 0.15); color: var(--on-neon); }
    .link-icon {
      flex: none; width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center;
      background: rgba(var(--neon-rgb), 0.12); color: var(--neon);
    }
    .link-icon svg { width: 22px; height: 22px; fill: currentColor; }
    .link-icon svg.stroke { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .link-text { flex: 1; min-width: 0; display: grid; gap: 2px; }
    .link-title { font: 600 1.08rem var(--font-display); }
    .link-sub { font-size: 0.85rem; color: var(--text-muted); }
    .link-arrow { flex: none; font-size: 1.2rem; transition: transform 0.3s var(--ease); }
    .link:hover .link-arrow { transform: translate(3px, -3px); }

    footer { font: 0.75rem var(--font-mono); color: var(--text-muted); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .in { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="glow" aria-hidden="true"></div>

  <main>
    <div class="avatar in" style="--d:0">
      <span class="ring" aria-hidden="true"></span>
      <picture>
        <source srcset="../assets/img/pedro.webp" type="image/webp" />
        <img src="../assets/img/pedro.jpg" alt="Foto de Pedro de Rossi" width="132" height="132" />
      </picture>
    </div>

    <div class="head in" style="--d:1">
      <span class="logo">&lt;PR /&gt;</span>
      <h1>Pedro <span>de Rossi</span></h1>
      <p class="tagline">Dashboards e sites sob medida,<br />pensados para o seu cliente.</p>
    </div>

    <ul class="links">
      <li class="in" style="--d:2">
        <a class="link primary" href="https://pedroderossi.github.io/" style="--d:0">
          <span class="link-icon"><svg class="stroke" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 8h18M9 13l-2 2 2 2M15 13l2 2-2 2"/></svg></span>
          <span class="link-text">
            <span class="link-title">Meu Portfólio</span>
            <span class="link-sub">Projetos, trajetória e contato</span>
          </span>
          <span class="link-arrow" aria-hidden="true">↗</span>
        </a>
      </li>
      <li class="in" style="--d:3">
        <a class="link" href="https://www.linkedin.com/in/pedro-de-rossi" target="_blank" rel="noopener" style="--d:1">
          <span class="link-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM9 9h3.8v1.7h.1c.5-1 1.8-2 3.8-2 4 0 4.8 2.6 4.8 6V21h-4v-5.6c0-1.3 0-3-1.9-3s-2.2 1.5-2.2 2.9V21H9z"/></svg></span>
          <span class="link-text">
            <span class="link-title">LinkedIn</span>
            <span class="link-sub">Experiência e conexões</span>
          </span>
          <span class="link-arrow" aria-hidden="true">↗</span>
        </a>
      </li>
    </ul>

    <footer class="in" style="--d:4">São Paulo · Brasil</footer>
  </main>

  <script>
    // Rede de partículas neon no fundo (leve, pausa quando a aba não está visível)
    (function () {
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const c = document.getElementById("bg"), ctx = c.getContext("2d");
      let w, h, dpr, pts = [], running = true;
      function resize() {
        dpr = Math.min(devicePixelRatio || 1, 2);
        w = c.width = innerWidth * dpr; h = c.height = innerHeight * dpr;
        const n = Math.min(60, Math.floor(innerWidth * innerHeight / 14000));
        pts = Array.from({ length: n }, () => ({
          x: Math.random() * w, y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.3 * dpr, vy: (Math.random() - 0.5) * 0.3 * dpr,
          r: (Math.random() * 1.3 + 0.6) * dpr,
        }));
      }
      function draw() {
        ctx.clearRect(0, 0, w, h);
        const L = 120 * dpr;
        for (let i = 0; i < pts.length; i++) {
          const p = pts[i];
          if (!reduced) {
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0 || p.x > w) p.vx *= -1;
            if (p.y < 0 || p.y > h) p.vy *= -1;
          }
          ctx.fillStyle = "rgba(0,217,255,0.7)";
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
          for (let j = i + 1; j < pts.length; j++) {
            const q = pts[j], d = Math.hypot(p.x - q.x, p.y - q.y);
            if (d < L) {
              ctx.strokeStyle = `rgba(0,217,255,${0.18 * (1 - d / L)})`;
              ctx.lineWidth = dpr;
              ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
            }
          }
        }
        if (running && !reduced) requestAnimationFrame(draw);
      }
      addEventListener("resize", () => { resize(); if (reduced) draw(); });
      document.addEventListener("visibilitychange", () => {
        running = !document.hidden;
        if (running && !reduced) requestAnimationFrame(draw);
      });
      resize(); draw();
    })();
  </script>
</body>
</html>
